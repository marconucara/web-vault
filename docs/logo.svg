    <path d="M4.65 16.65V4.55H7.65"/>
    <path d="M25.15 4.55H28.35V8.9"/>
    <path d="M28.35 12.6V27.45H25.3"/>
  </g>
  <circle cx="5.1" cy="22.4" r="2.7" fill="#3B82F6"/>
  <path d="M8.05 19.4L12.67 13.46H21.9V21.25H23.35" stroke="#8A94A6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="10.62" y="11.41" width="4.1" height="4.1" rx="0.9" fill="#8A94A6"/>
</svg>
