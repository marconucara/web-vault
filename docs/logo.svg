<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 32 32" fill="none" role="img" aria-label="WebVault">
  <!-- Same geometry as brand/mark.svg, with the colours resolved to literals:
       GitHub strips CSS variables and does not supply a currentColor, so the
       inline version would render half-invisible in a README. The brand blue
       reads on both the light and the dark GitHub theme, so one file serves
       both. Keep in step with brand/mark.svg if that geometry ever changes. -->
