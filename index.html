<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WebVault</title>
    <!-- Brand icons: see brand/ASSETS.md. Shipped by the package and copied into
         dist by copy-brand.mjs (served in dev by the brand-dev middleware).
         hrefs are relative because the Vite config sets base: './'.
         Order matters: browsers that understand SVG favicons take the second
         line, the others stop at the first. -->
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="mask-icon" href="./safari-pinned-tab.svg" color="#3B82F6" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171717" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
