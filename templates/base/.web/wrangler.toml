# Cloudflare Workers configuration, versioned in the repo.
#
# Holds ONLY non-secret, deploy-portable settings. Secrets (GITHUB_TOKEN) and the
# build-time keys (MAP_CACHE_KEY / SITE_URL) stay as Worker env vars/secrets.
#
# Deploy is git-connected (Workers Builds): build command "yarn build" runs
# `wv build`, which produces dist/ and generates .wv/worker.js (the entry below).

# Must match the Cloudflare Worker name.
name = "web-vault-template"

# Worker entry generated by `wv build` (gitignored build artifact under .wv/).
main = ".wv/worker.js"

# Runtime API version for the Worker.
compatibility_date = "2026-07-01"

# The commit handler uses only Web APIs, no Node builtins, so nodejs_compat is
# left OFF. Enable it only if the Worker later imports a `node:` module.
# compatibility_flags = ["nodejs_compat"]

[assets]
# Static build output produced by `yarn build`.
directory = "./dist"
# Bound as env.ASSETS inside the Worker.
binding = "ASSETS"
# Hash routing + a real 404.html: no SPA rewrite; serve dist/404.html on a miss.
not_found_handling = "404-page"
# Only the commit endpoint invokes the Worker; every other path is served
# directly from static assets.
run_worker_first = ["/api/*"]

# The commit handler auto-detects the vault repo from its git remote. To pin it
# explicitly (or in a fork), set it here instead:
# [vars]
# GITHUB_REPO = "you/your-vault"
